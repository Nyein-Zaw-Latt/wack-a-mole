```html
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Whack-A-Mole</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: linear-gradient(
          #87ceeb 0%,
          #87ceeb 35%,
          #6dbb45 35%,
          #4f9b35 100%
        );
        color: white;
        text-align: center;
        overflow-x: hidden;
      }

      /* =========================
   SCREENS
========================= */

      .screen {
        display: none;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        padding: 25px;
      }

      .screen.active {
        display: flex;
      }

      /* =========================
   BUTTONS
========================= */

      .main-button {
        margin-top: 25px;
        padding: 14px 40px;

        border: none;
        border-radius: 14px;

        background: #ffb703;
        color: #222;

        font-size: 18px;
        font-weight: bold;

        cursor: pointer;

        box-shadow: 0 6px 0 #c98500;

        transition: 0.15s;
      }

      .main-button:hover {
        transform: translateY(-3px);
      }

      .main-button:active {
        transform: translateY(4px);
        box-shadow: 0 2px 0 #c98500;
      }

      /* =========================
   START SCREEN
========================= */

      .start-content h1 {
        font-size: clamp(45px, 8vw, 80px);

        text-shadow:
          4px 4px 0 #2c5420,
          8px 8px 15px rgba(0, 0, 0, 0.3);
      }

      .start-content p {
        font-size: 20px;
      }

      /* =========================
   CHARACTER SELECTION
========================= */

      .character-container {
        width: 100%;
        max-width: 800px;

        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .character-container h1 {
        font-size: 42px;
        text-shadow: 3px 3px 0 #2c5420;
      }

      .character-slider {
        width: 100%;

        display: flex;
        align-items: center;
        justify-content: center;

        gap: 25px;
      }

      .arrow {
        width: 60px;
        height: 60px;

        border: none;
        border-radius: 50%;

        background: white;
        color: #333;

        font-size: 30px;
        cursor: pointer;
      }

      .character-card {
        width: min(450px, 80vw);

        min-height: 420px;

        padding: 30px;

        background: white;
        color: #333;

        border-radius: 25px;

        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .character-emoji {
        font-size: 120px;
      }

      .character-name {
        width: 100%;

        padding: 12px;

        background: #4f9b35;
        color: white;

        border-radius: 12px;

        font-size: 28px;
        font-weight: bold;
      }

      .character-description {
        margin-top: 20px;

        padding: 18px;

        background: #f1f1f1;

        border-radius: 14px;

        line-height: 1.5;
      }

      .character-stats {
        margin-top: 18px;

        width: 100%;

        display: flex;
        gap: 10px;
      }

      .stat-box {
        flex: 1;

        padding: 10px;

        background: #e6f4df;

        border-radius: 10px;

        font-size: 13px;
      }

      .character-dots {
        margin-top: 20px;

        display: flex;
        gap: 10px;
      }

      .dot {
        width: 12px;
        height: 12px;

        border-radius: 50%;

        background: rgba(255, 255, 255, 0.5);
      }

      .dot.active {
        background: white;
        transform: scale(1.3);
      }

      .swipe-text {
        margin-top: 15px;
      }

      /* =========================
   LEVEL SELECTION
========================= */

      .level-container {
        width: 100%;
        max-width: 850px;
      }

      .level-container h1 {
        font-size: 45px;
      }

      .selected-character {
        margin: 20px auto;

        padding: 12px 20px;

        width: fit-content;

        background: rgba(0, 0, 0, 0.5);

        border-radius: 15px;
      }

      .level-grid {
        margin-top: 40px;

        display: grid;

        grid-template-columns: repeat(4, 1fr);

        gap: 20px;
      }

      .level {
        height: 140px;

        border: none;
        border-radius: 20px;

        background: white;

        color: #333;

        font-size: 25px;
        font-weight: bold;

        cursor: pointer;

        transition: 0.2s;

        box-shadow: 0 8px 0 rgba(0, 0, 0, 0.2);
      }

      .level:hover:not(.locked) {
        transform: translateY(-5px);
      }

      .level.locked {
        background: #777;
        color: #ccc;
        cursor: not-allowed;
      }

      /* =========================
   GAME SCREEN
========================= */

      .game-content {
        width: min(850px, 95%);
      }

      .game-title {
        margin: 0 0 15px;
        font-size: 35px;
        text-shadow: 3px 3px 0 #2c5420;
      }

      .game-stats {
        display: flex;

        justify-content: center;
        flex-wrap: wrap;

        gap: 10px;

        margin-bottom: 20px;
      }

      .game-stat {
        padding: 10px 15px;

        background: rgba(0, 0, 0, 0.65);

        border-radius: 12px;

        min-width: 110px;
      }

      /* =========================
   GAME CONTAINER
========================= */

      .game-container {
        padding: 25px;

        background: rgba(50, 120, 45, 0.8);

        border: 5px solid #39752d;

        border-radius: 25px;

        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
      }

      /* =========================
   BOARD
========================= */

      .game-board {
        display: grid;

        justify-content: center;

        gap: 20px;
      }

      /* =========================
   HOLES
========================= */

      .hole {
        width: 120px;
        height: 90px;

        position: relative;

        overflow: hidden;

        background: radial-gradient(
          ellipse at center,
          #1f120b 0%,
          #3d2417 55%,
          #6d4327 100%
        );

        border-radius: 50%;

        box-shadow:
          inset 0 12px 15px rgba(0, 0, 0, 0.7),
          0 6px 0 #2c6b30;
      }

      /* =========================
   MOLES
========================= */

      .mole {
        width: 85px;
        height: 85px;

        position: absolute;

        left: 50%;
        bottom: -90px;

        transform: translateX(-50%);

        display: flex;

        align-items: center;
        justify-content: center;

        font-size: 58px;

        cursor: pointer;

        user-select: none;

        transition: bottom 0.18s ease-out;

        z-index: 2;
      }

      .mole.show {
        bottom: 5px;
      }

      .mole.thick {
        filter: drop-shadow(0 0 4px #555);
      }

      /* HIT COUNTER */

      .hit-counter {
        position: absolute;

        top: 0;
        right: 8px;

        padding: 4px 8px;

        background: white;
        color: #333;

        border-radius: 50%;

        font-size: 13px;
        font-weight: bold;

        display: none;

        z-index: 5;
      }

      /* =========================
   MESSAGE
========================= */

      .game-message {
        margin-top: 15px;

        min-height: 30px;

        font-size: 20px;
        font-weight: bold;
      }

      /* =========================
   MOBILE
========================= */

      @media (max-width: 700px) {
        .character-slider {
          gap: 8px;
        }

        .arrow {
          width: 45px;
          height: 45px;
          font-size: 22px;
        }

        .character-card {
          padding: 20px;
        }

        .character-emoji {
          font-size: 90px;
        }

        .level-grid {
          grid-template-columns: repeat(2, 1fr);
        }

        .hole {
          width: 85px;
          height: 70px;
        }

        .mole {
          font-size: 45px;
        }
      }
    </style>
  </head>

  <body>
    <!-- =========================
     START SCREEN
========================= -->

    <div id="startScreen" class="screen active">
      <div class="start-content">
        <h1>🐹 WHACK-A-MOLE!</h1>

        <p>Whack the moles. Avoid bombs. Survive all levels!</p>

        <button class="main-button" id="startGameButton">Start Game</button>
      </div>
    </div>

    <!-- =========================
     CHARACTER SCREEN
========================= -->

    <div id="characterScreen" class="screen">
      <div class="character-container">
        <h1>Choose Your Character</h1>

        <div class="character-slider">
          <button class="arrow" id="leftArrow">❮</button>

          <div class="character-card" id="characterCard">
            <div class="character-emoji" id="characterEmoji"></div>

            <div class="character-name" id="characterName"></div>

            <div class="character-description" id="characterDescription"></div>

            <div class="character-stats">
              <div class="stat-box" id="speedStat"></div>

              <div class="stat-box" id="normalStat"></div>

              <div class="stat-box" id="thickStat"></div>
            </div>
          </div>

          <button class="arrow" id="rightArrow">❯</button>
        </div>

        <div class="character-dots" id="characterDots"></div>

        <div class="swipe-text">👈 Swipe or use arrows 👉</div>

        <button class="main-button" id="selectCharacterButton">Select</button>
      </div>
    </div>

    <!-- =========================
     LEVEL SCREEN
========================= -->

    <div id="levelScreen" class="screen">
      <div class="level-container">
        <h1>Select Level</h1>

        <div class="selected-character" id="selectedCharacterDisplay"></div>

        <div class="level-grid">
          <button class="level" data-level="1">Level 1</button>

          <button class="level locked" data-level="2">
            🔒
            <br />
            Level 2
          </button>

          <button class="level locked" data-level="3">
            🔒
            <br />
            Level 3
          </button>

          <button class="level locked" data-level="4">
            🔒
            <br />
            Level 4
          </button>
        </div>
      </div>
    </div>

    <!-- =========================
     GAME SCREEN
========================= -->

    <div id="gameScreen" class="screen">
      <div class="game-content">
        <h1 class="game-title">🐹 WHACK-A-MOLE</h1>

        <div class="game-stats">
          <div class="game-stat">
            Level:
            <span id="levelDisplay">1</span>
          </div>

          <div class="game-stat">
            Score:
            <span id="scoreDisplay">0</span>
          </div>

          <div class="game-stat">
            Lives: ❤️ <span id="livesDisplay">5</span>
          </div>

          <div class="game-stat">Time: ⏱️ <span id="timeDisplay">30</span></div>
        </div>

        <div class="game-container">
          <div class="game-board" id="gameBoard"></div>
        </div>

        <div class="game-message" id="gameMessage"></div>

        <button class="main-button" id="leaveGameButton">Back to Levels</button>
      </div>
    </div>

    <script>
      /* =========================
   CHARACTERS
========================= */

      const characters = [
        {
          name: "Big John",
          emoji: "🐻",

          description:
            "Slow but very strong. One tap defeats both normal and thick moles.",

          speed: "Slow",
          normalTaps: 1,
          thickTaps: 1,
        },

        {
          name: "John",
          emoji: "🐶",

          description:
            "Balanced. One tap defeats normal moles and two taps defeat thick moles.",

          speed: "Normal",
          normalTaps: 1,
          thickTaps: 2,
        },

        {
          name: "Small John",
          emoji: "🐭",

          description:
            "Fast but weaker. Normal moles need two taps and thick moles need three.",

          speed: "Fast",
          normalTaps: 2,
          thickTaps: 3,
        },
      ];

      /* =========================
   LEVEL SETTINGS
========================= */

      const levels = {
        1: {
          holes: 9,
          columns: 3,

          stayTime: 2000,
          spawnDelay: 1400,

          maxMoles: 1,

          thickChance: 0.1,
        },

        2: {
          holes: 12,
          columns: 4,

          stayTime: 1600,
          spawnDelay: 1000,

          maxMoles: 2,

          thickChance: 0.2,
        },

        3: {
          holes: 16,
          columns: 4,

          stayTime: 1100,
          spawnDelay: 750,

          maxMoles: 2,

          thickChance: 0.3,
        },

        4: {
          holes: 16,
          columns: 4,

          stayTime: 750,
          spawnDelay: 500,

          maxMoles: 3,

          thickChance: 0.4,
        },
      };

      /* =========================
   GAME STATE
========================= */

      let characterIndex = 1;
      let selectedCharacter = null;

      let currentLevel = 1;

      let score = 0;
      let lives = 5;
      let time = 30;

      let gameRunning = false;

      let gameTimer = null;
      let spawnTimer = null;

      let activeMoles = new Set();

      let unlockedLevel = 1;

      /* =========================
   ELEMENTS
========================= */

      const startScreen = document.getElementById("startScreen");

      const characterScreen = document.getElementById("characterScreen");

      const levelScreen = document.getElementById("levelScreen");

      const gameScreen = document.getElementById("gameScreen");

      const startGameButton = document.getElementById("startGameButton");

      const leftArrow = document.getElementById("leftArrow");

      const rightArrow = document.getElementById("rightArrow");

      const characterCard = document.getElementById("characterCard");

      const characterEmoji = document.getElementById("characterEmoji");

      const characterName = document.getElementById("characterName");

      const characterDescription = document.getElementById(
        "characterDescription",
      );

      const speedStat = document.getElementById("speedStat");

      const normalStat = document.getElementById("normalStat");

      const thickStat = document.getElementById("thickStat");

      const characterDots = document.getElementById("characterDots");

      const selectCharacterButton = document.getElementById(
        "selectCharacterButton",
      );

      const selectedCharacterDisplay = document.getElementById(
        "selectedCharacterDisplay",
      );

      const gameBoard = document.getElementById("gameBoard");

      const levelDisplay = document.getElementById("levelDisplay");

      const scoreDisplay = document.getElementById("scoreDisplay");

      const livesDisplay = document.getElementById("livesDisplay");

      const timeDisplay = document.getElementById("timeDisplay");

      const gameMessage = document.getElementById("gameMessage");

      /* =========================
   SCREEN SWITCHING
========================= */

      function showScreen(screen) {
        clearScreenTimers();

        document.querySelectorAll(".screen").forEach((item) => {
          item.classList.remove("active");
        });

        screen.classList.add("active");
      }

      /* =========================
   CHARACTER SELECTION
========================= */

      function updateCharacter() {
        const character = characters[characterIndex];

        characterEmoji.textContent = character.emoji;

        characterName.textContent = character.name;

        characterDescription.textContent = character.description;

        speedStat.innerHTML = `<strong>Speed</strong><br>
        ${character.speed}`;

        normalStat.innerHTML = `<strong>Normal</strong><br>
        ${character.normalTaps} Tap(s)`;

        thickStat.innerHTML = `<strong>Thick</strong><br>
        ${character.thickTaps} Tap(s)`;

        characterDots.innerHTML = "";

        characters.forEach((character, index) => {
          const dot = document.createElement("div");

          dot.classList.add("dot");

          if (index === characterIndex) {
            dot.classList.add("active");
          }

          characterDots.appendChild(dot);
        });
      }

      function nextCharacter() {
        characterIndex = (characterIndex + 1) % characters.length;

        updateCharacter();
      }

      function previousCharacter() {
        characterIndex--;

        if (characterIndex < 0) {
          characterIndex = characters.length - 1;
        }

        updateCharacter();
      }

      startGameButton.addEventListener("click", () => {
        showScreen(characterScreen);

        updateCharacter();
      });

      leftArrow.addEventListener("click", previousCharacter);

      rightArrow.addEventListener("click", nextCharacter);

      /* =========================
   SWIPE
========================= */

      let touchStartX = 0;

      characterCard.addEventListener("touchstart", (event) => {
        touchStartX = event.changedTouches[0].screenX;
      });

      characterCard.addEventListener("touchend", (event) => {
        const touchEndX = event.changedTouches[0].screenX;

        const difference = touchEndX - touchStartX;

        if (difference < -50) {
          nextCharacter();
        }

        if (difference > 50) {
          previousCharacter();
        }
      });

      /* =========================
   SELECT CHARACTER
========================= */

      selectCharacterButton.addEventListener("click", () => {
        selectedCharacter = characters[characterIndex];

        selectedCharacterDisplay.textContent = `Playing as: ${selectedCharacter.emoji} ${selectedCharacter.name}`;

        updateLevelButtons();

        showScreen(levelScreen);
      });

      /* =========================
   LEVEL BUTTONS
========================= */

      function updateLevelButtons() {
        document.querySelectorAll(".level").forEach((button) => {
          const level = Number(button.dataset.level);

          if (level <= unlockedLevel) {
            button.classList.remove("locked");

            button.innerHTML = `Level ${level}`;
          } else {
            button.classList.add("locked");

            button.innerHTML = `🔒<br>Level ${level}`;
          }
        });
      }

      document.querySelectorAll(".level").forEach((button) => {
        button.addEventListener("click", () => {
          if (button.classList.contains("locked")) {
            return;
          }

          startLevel(Number(button.dataset.level));
        });
      });

      /* =========================
   CREATE BOARD
========================= */

      function createBoard() {
        gameBoard.innerHTML = "";

        const settings = levels[currentLevel];

        gameBoard.style.gridTemplateColumns = `repeat(${settings.columns}, auto)`;

        for (let i = 0; i < settings.holes; i++) {
          const hole = document.createElement("div");

          hole.classList.add("hole");

          const mole = document.createElement("div");

          mole.classList.add("mole");

          const counter = document.createElement("div");

          counter.classList.add("hit-counter");

          hole.appendChild(mole);

          hole.appendChild(counter);

          gameBoard.appendChild(hole);
        }
      }

      /* =========================
   START LEVEL
========================= */

      function startLevel(level) {
        currentLevel = level;

        score = 0;
        lives = 5;
        time = 30;

        gameRunning = true;

        showGameScreen();

        createBoard();

        updateGameUI();

        startGameTimer();

        startSpawnLoop();
      }

      function showGameScreen() {
        document.querySelectorAll(".screen").forEach((item) => {
          item.classList.remove("active");
        });

        gameScreen.classList.add("active");
      }

      /* =========================
   UI
========================= */

      function updateGameUI() {
        levelDisplay.textContent = currentLevel;

        scoreDisplay.textContent = score;

        livesDisplay.textContent = lives;

        timeDisplay.textContent = time;
      }

      /* =========================
   GAME TIMER
========================= */

      function startGameTimer() {
        clearInterval(gameTimer);

        gameTimer = setInterval(() => {
          if (!gameRunning) return;

          time--;

          timeDisplay.textContent = time;

          if (time <= 0) {
            completeLevel();
          }
        }, 1000);
      }

      /* =========================
   SPAWN LOOP
========================= */

      function startSpawnLoop() {
        const settings = levels[currentLevel];

        function loop() {
          if (!gameRunning) {
            return;
          }

          if (activeMoles.size < settings.maxMoles) {
            spawnMole();
          }

          spawnTimer = setTimeout(loop, settings.spawnDelay);
        }

        loop();
      }

      /* =========================
   SPAWN MOLE
========================= */

      function spawnMole() {
        if (!gameRunning) return;

        const settings = levels[currentLevel];

        const moles = [...document.querySelectorAll(".mole")];

        const availableMoles = moles.filter((mole) => !activeMoles.has(mole));

        if (availableMoles.length === 0) {
          return;
        }

        const mole =
          availableMoles[Math.floor(Math.random() * availableMoles.length)];

        const random = Math.random();

        let type;

        if (random < 0.15) {
          type = "bomb";
        } else if (random < 0.15 + settings.thickChance) {
          type = "thick";
        } else {
          type = "normal";
        }

        setupMole(mole, type);

        activeMoles.add(mole);

        mole.classList.add("show");

        mole.timeout = setTimeout(() => {
          removeMole(mole, true);
        }, settings.stayTime);
      }

      /* =========================
   SETUP MOLE
========================= */

      function setupMole(mole, type) {
        mole.dataset.type = type;

        mole.classList.remove("thick");

        const counter = mole.parentElement.querySelector(".hit-counter");

        counter.style.display = "none";

        if (type === "bomb") {
          mole.textContent = "💣";

          mole.dataset.hits = 1;
        } else if (type === "thick") {
          mole.textContent = "🦍";

          mole.classList.add("thick");

          mole.dataset.hits = selectedCharacter.thickTaps;

          counter.textContent = mole.dataset.hits;

          counter.style.display = "block";
        } else {
          mole.textContent = "🐹";

          mole.dataset.hits = selectedCharacter.normalTaps;

          if (Number(mole.dataset.hits) > 1) {
            counter.textContent = mole.dataset.hits;

            counter.style.display = "block";
          }
        }
      }

      /* =========================
   CLICK MOLE
========================= */

      gameBoard.addEventListener("click", (event) => {
        const mole = event.target;

        if (
          !gameRunning ||
          !mole.classList.contains("mole") ||
          !activeMoles.has(mole)
        ) {
          return;
        }

        /* BOMB */

        if (mole.dataset.type === "bomb") {
          clearTimeout(mole.timeout);

          removeMole(mole, false);

          loseLife();

          return;
        }

        /* NORMAL / THICK */

        let hits = Number(mole.dataset.hits);

        hits--;

        mole.dataset.hits = hits;

        const counter = mole.parentElement.querySelector(".hit-counter");

        /* MOLE DEFEATED */

        if (hits <= 0) {
          clearTimeout(mole.timeout);

          removeMole(mole, false);

          score++;

          scoreDisplay.textContent = score;

          showMessage("+1 SCORE!");
        } else {

        /* UPDATE HITS */
          counter.textContent = hits;

          counter.style.display = "block";

          showMessage(`${hits} hit(s) remaining!`);
        }
      });

      /* =========================
   REMOVE MOLE
========================= */

      function removeMole(mole, missed) {
        if (!activeMoles.has(mole)) {
          return;
        }

        clearTimeout(mole.timeout);

        mole.classList.remove("show");

        activeMoles.delete(mole);

        const counter = mole.parentElement.querySelector(".hit-counter");

        counter.style.display = "none";

        if (missed && mole.dataset.type !== "bomb") {
          loseLife();
        }
      }

      /* =========================
   LOSE LIFE
========================= */

      function loseLife() {
        if (!gameRunning) return;

        lives--;

        livesDisplay.textContent = lives;

        showMessage("💔 LIFE LOST!");

        if (lives <= 0) {
          gameOver();
        }
      }

      /* =========================
   COMPLETE LEVEL
========================= */

      function completeLevel() {
        if (!gameRunning) return;

        gameRunning = false;

        clearScreenTimers();

        if (currentLevel < 4) {
          unlockedLevel = Math.max(unlockedLevel, currentLevel + 1);

          showMessage("🎉 LEVEL COMPLETE!");

          setTimeout(() => {
            alert(`Level ${currentLevel} Complete!`);

            updateLevelButtons();

            showLevelScreen();
          }, 500);
        } else {
          showMessage("🏆 YOU WIN!");

          setTimeout(() => {
            alert(`🏆 YOU COMPLETED ALL LEVELS!\n\nFinal Score: ${score}`);

            updateLevelButtons();

            showLevelScreen();
          }, 700);
        }
      }

      /* =========================
   GAME OVER
========================= */

      function gameOver() {
        gameRunning = false;

        clearScreenTimers();

        setTimeout(() => {
          alert(`💀 GAME OVER!\n\nScore: ${score}`);

          showLevelScreen();
        }, 300);
      }

      /* =========================
   MESSAGE
========================= */

      let messageTimer;

      function showMessage(text) {
        gameMessage.textContent = text;

        clearTimeout(messageTimer);

        messageTimer = setTimeout(() => {
          gameMessage.textContent = "";
        }, 800);
      }

      /* =========================
   CLEAR TIMERS
========================= */

      function clearScreenTimers() {
        clearInterval(gameTimer);

        clearTimeout(spawnTimer);

        document.querySelectorAll(".mole").forEach((mole) => {
          clearTimeout(mole.timeout);

          mole.classList.remove("show");
        });

        activeMoles.clear();
      }

      /* =========================
   BACK TO LEVEL SCREEN
========================= */

      function showLevelScreen() {
        clearScreenTimers();

        document.querySelectorAll(".screen").forEach((item) => {
          item.classList.remove("active");
        });

        levelScreen.classList.add("active");
      }

      document
        .getElementById("leaveGameButton")
        .addEventListener("click", () => {
          gameRunning = false;

          clearScreenTimers();

          showLevelScreen();
        });

      /* =========================
   INITIAL SETUP
========================= */

      updateCharacter();

      updateLevelButtons();
    </script>
  </body>
</html>
